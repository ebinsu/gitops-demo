apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-store
  namespace: team-a
spec:
  provider:
    vault:
      server: "http://vault.hashicorp:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "team-a"
          serviceAccountRef:
            name: team-a
